spring.application.name=dataStream
server.port=9199
server.servlet.context-path=/datastream
#http://localhost:9199/datastream/#/

spring.profiles.active = h2


spring.datasource.druid.name=metadb
spring.datasource.druid.metadb.url=jdbc:h2:file:./h2db/testdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.druid.metadb.username=root
spring.datasource.druid.metadb.password=root
spring.datasource.druid.metadb.driver-class-name=org.h2.Driver

#spring.datasource.druid.metadb.url=jdbc:mysql://192.168.239.128:3306/data-stream?useSSL=false
#spring.datasource.druid.metadb.username=root
#spring.datasource.druid.metadb.password=root
#spring.datasource.druid.metadb.driver-class-name=com.mysql.jdbc.Driver

#spring.datasource.druid.metadb.url=jdbc:mysql://127.0.0.1:3306/data_stream?useSSL=false
#spring.datasource.druid.metadb.username=root
#spring.datasource.druid.metadb.password=root
#spring.datasource.druid.metadb.driver-class-name=com.mysql.jdbc.Driver

spring.datasource.druid.metadb.validation-query=select 1

spring.datasource.druid.metadb.initial-size= 5
spring.datasource.druid.metadb.min-idle=5
spring.datasource.druid.metadb.max-active= 5
spring.datasource.druid.metadb.max-wait=60000
spring.datasource.druid.metadb.time-between-eviction-runs-millis=60000
spring.datasource.druid.metadb.min-evictable-idle-time-millis=300000
spring.datasource.druid.metadb.test-while-idle=true
spring.datasource.druid.metadb.test-on-borrow=false
spring.datasource.druid.metadb.test-on-return=false
spring.datasource.druid.metadb.pool-prepared-statements=true
spring.datasource.druid.metadb.filter.stat.log-slow-sql=true
spring.datasource.druid.metadb.filter.stat.slow-sql-millis=2000
spring.datasource.druid.metadb.filter.wall.enabled=true
spring.datasource.druid.metadb.filter.wall.config.multi-statement-allow=true



############### mybatis######################################
mybatis.configuration.mapUnderscoreToCamelCase=true
mybatis.mapper-locations=classpath*:mapper/*.xml
#oracle\u6570\u636E\u5E93\u9700\u8981\u8FD9\u4E2A\u914D\u7F6E\uFF0C\u4E0D\u7136\u63D2\u5165null\u5B57\u6BB5\u62A5\u9519;\u975Eoracle\u53EF\u4EE5\u5C4F\u853D\u6389
mybatis.configuration.jdbc-type-for-null=null 
############### mybatis######################################

#\u6BCF\u4E2A\u4EFB\u52A1\u901A\u9053\u6570\u636E
datastream.queue.channel=1
datastream.start-executor-type=1|3
datastream.move-trace.enable = true
#\u662F\u5426\u6267\u884C\u6570\u636E\u5E93\u521D\u59CB\u5316\u5904\u7406
datastream.init-data-meta-db.enable = false

#\u6CE8\u610F\uFF1A
#data-pool-count>thread-count\u5927\u4E9B
datastream.source.data-pool-count=4
datastream.source.thread-count=2
datastream.source.select-count=100
datastream.source.data-send-mode=1
#\u5355\u4E2AJava\u8FDB\u7A0B\u6E90\u7AEF\u6700\u5927\u7EBF\u7A0B\u6570\uFF0C\u63A7\u5236\u5728\u5355\u4E2A\u8FDB\u7A0B\u4E2D\u6240\u6709\u4EFB\u52A1\u7EBF\u7A0B\u4E0D\u8981\u8D85\u8FC7\u8FD9\u4E2A\u503C
datastream.source.core-pool-size=50

#\u6CE8\u610F\uFF1A
#target.data-pool-count>target.thread-count\u5927\u4E9B
datastream.target.data-poll-count=4
datastream.target.thread-count=2
datastream.target.insert-count=50
datastream.target.move-info-flag=1
#\u5355\u4E2AJava\u8FDB\u7A0B\u76EE\u6807\u7AEF\u6700\u5927\u7EBF\u7A0B\u6570\uFF0C\u63A7\u5236\u5728\u5355\u4E2A\u8FDB\u7A0B\u4E2D\u6240\u6709\u4EFB\u52A1\u7EBF\u7A0B\u4E0D\u8981\u8D85\u8FC7\u8FD9\u4E2A\u503C
datastream.target.core-pool-size=50

# \u662F\u5426\u4E3Asso\u767B\u5F55\u6A21\u5F0F
auth.sso.mode.enabled=false
auth.local.systemUserAuth.test.mode=true
auth.local.systemUserAuth.test.systemUserCode=admin
auth.local.systemUserAuth.test.password=admin
# \u53D6\u6D88\u6388\u6743\uFF08\u5373\u653E\u884C\u6240\u6709\u63A5\u53E3\u8BF7\u6C42\uFF09
auth.dataStreamPermit=false

auth.sso.loginPath=/api/auth/login
auth.sso.logoutPath=/api/auth/logout

auth.sso.whiteList=/datastream/h2,/datastream/h2/**,/h2,/h2/**,/h2-console,/h2-console/**

logging.config=classpath:logback-spring.xml
logging.level.root=debug
#logging.level.org.springframework=DEBUG

